name: Deploy CodeIgniter to GoDaddy

on:
  push:
    branches:
      - master # Triggers deployment when code is pushed or a PR is merged to master

jobs:
  web-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 

    - name: Sync files to GoDaddy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/mrm/ # IMPORTANT: Verify this is the exact folder path for your subdomain in GoDaddy
        exclude: |
          **/.git*
          **/.git*/**
          .github/**
          AGENTS.md
